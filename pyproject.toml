[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "turbomachinery-geometry-studio"
version = "0.3.0"
description = "Preliminary centrifugal-pump sizing and validated CAD geometry generation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cadquery>=2.8,<3",
  "PySide6>=6.7,<7",
  "pyvista>=0.44,<1",
  "pyvistaqt>=0.11,<1",
]

[project.scripts]
pump-studio = "gui:main"
pump-geometry = "impeller_generator:main"

[tool.setuptools]
py-modules = ["gui", "impeller_generator"]

[tool.setuptools.packages.find]
include = ["core*"]
